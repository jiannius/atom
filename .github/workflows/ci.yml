name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      # No composer.lock in the repo: dependencies resolve fresh, so the cache is keyed on composer.json.
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/pest

  consumer:
    name: Consumer Tailwind (${{ matrix.tw }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # floor = the hosts' minimum Tailwind, latest = the newest 4.x; versions are pinned in tests/consumer/<tw>/package.json
        tw: [floor, latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/consumer/${{ matrix.tw }}/package-lock.json

      - run: npm ci
        working-directory: tests/consumer/${{ matrix.tw }}

      - run: node tests/consumer/build.mjs ${{ matrix.tw }}

      # A class that is written only in components/button/index.blade.php (no view, no src file): it is in the
      # build only if the scan of atom's components/ worked. A utility from the e2e view would prove nothing.
      - name: The build holds a utility only components/ declares
        run: grep -qF 'group-\[\.is-loading\]\/button\:flex' tests/consumer/build/${{ matrix.tw }}.css

      - uses: actions/upload-artifact@v4
        with:
          name: consumer-${{ matrix.tw }}
          path: tests/consumer/build/${{ matrix.tw }}.css
          if-no-files-found: error

  e2e:
    name: Playwright (Chromium ${{ matrix.shard }}/6)
    needs: consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Each shard is its own runner with its own `testbench serve`, so the config's one worker per server stays. Six, not four, since the
        # disabled-state rig (about 650 tests at roughly two seconds each on one worker) joined the roughly 3300 before it. Playwright cuts the
        # file-name-ordered list of test groups into equal chunks, so the rig's specs are named to sort apart and make each row a group of its own:
        # `playwright test --list --project=chromium --shard=n/6` puts it in shards 2 to 6, at most about 210 of its tests in one (see tests/e2e/disabled-behaviour-rows.js).
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tests/e2e/consumer-tailwind.spec.js serves what the consumer job compiled
      - uses: actions/download-artifact@v4
        with:
          pattern: consumer-*
          path: tests/consumer/build
          merge-multiple: true

      - run: node_modules/.bin/playwright install --with-deps chromium

      - run: node_modules/.bin/playwright test --project=chromium --shard=${{ matrix.shard }}/6

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # One check for the six shards, under the name the single job had.
  e2e-result:
    name: Playwright (Chromium)
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo "Playwright shards: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = "success"

  # The calendar's gestures and its keyboard and look specs in the other two engines (the projects `webkit-*` and `firefox-*` of playwright.config.js: a subset
  # of the calendar's specs, not the whole suite). Not part of "Playwright (Chromium)": that check is the four shards above. `--no-deps` because each of these
  # projects depends on `chromium` in the config, so a local run goes after it, and here Chromium has its own job.
  e2e-engines:
    name: Playwright calendar (${{ matrix.browser }})
    needs: consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tests/e2e/calendar-look.spec.js reads what the consumer job compiled
      - uses: actions/download-artifact@v4
        with:
          pattern: consumer-*
          path: tests/consumer/build
          merge-multiple: true

      - run: node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}

      - run: node_modules/.bin/playwright test --no-deps --project=${{ matrix.browser }}-a11y --project=${{ matrix.browser }}-select --project=${{ matrix.browser }}-move --project=${{ matrix.browser }}-look

      # The shells' keyboard and focus specs, in WebKit only (Safari does not focus a button on click and its Tab skips links); Firefox has no
      # such project. This job's name stays "Playwright calendar (...)" so required checks do not change, but the webkit leg also gates these
      # specs, and the step runs after a calendar failure too (everything but a cancelled run).
      - if: ${{ !cancelled() && matrix.browser == 'webkit' }}
        run: node_modules/.bin/playwright test --no-deps --project=webkit-shell

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-engines-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

  # The disabled-state rig (tests/e2e/*disabled-behaviour-*.spec.js and morph-disabled-*.spec.js) in the other two engines: what a click on a child of a disabled
  # button does, which controls Tab reaches (Safari's Tab skips buttons, so it walks with Alt+Tab), a file chooser, a drop and a selection are the
  # engine's to decide, and Chromium alone says nothing about them. A job of its own so the calendar job's time does not grow with it. `--no-deps`
  # as for the calendar projects: each `<browser>-disabled` project depends on `chromium` in the config, and here Chromium has its shards.
  e2e-disabled:
    name: Playwright disabled state (${{ matrix.browser }})
    needs: consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # WebKit passes this rig on Linux CI. Firefox has never had a green run (it does not launch on the Mac the rig was written on, and CI's first run
    # showed a native <select> is not seen open there, now a per-engine skip in disabled-helpers.js): a failure is information until it has one. It may show
    # another place where Firefox legitimately differs, to be marked per engine in disabled-ledger.js or ENGINE_SKIPS with the reason. Drop this line once
    # Firefox is green.
    continue-on-error: ${{ matrix.browser == 'firefox' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # the rig opens every case on the consumer's Tailwind
      - uses: actions/download-artifact@v4
        with:
          pattern: consumer-*
          path: tests/consumer/build
          merge-multiple: true

      - run: node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}

      - run: node_modules/.bin/playwright test --no-deps --project=${{ matrix.browser }}-disabled

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-disabled-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore

  dist:
    name: dist/ is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Committed dist/ matches the build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is stale: run 'npm run build' and commit the result"
            exit 1
          fi
