name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      # No composer.lock in the repo: dependencies resolve fresh, so the cache is keyed on composer.json.
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/pest

  consumer:
    name: Consumer Tailwind (${{ matrix.tw }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # floor = the hosts' minimum Tailwind, latest = the newest 4.x; versions are pinned in tests/consumer/<tw>/package.json
        tw: [floor, latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/consumer/${{ matrix.tw }}/package-lock.json

      - run: npm ci
        working-directory: tests/consumer/${{ matrix.tw }}

      - run: node tests/consumer/build.mjs ${{ matrix.tw }}

      # A class that is written only in components/button/index.blade.php (no view, no src file): it is in the
      # build only if the scan of atom's components/ worked. A utility from the e2e view would prove nothing.
      - name: The build holds a utility only components/ declares
        run: grep -qF 'group-\[\.is-loading\]\/button\:flex' tests/consumer/build/${{ matrix.tw }}.css

      - uses: actions/upload-artifact@v4
        with:
          name: consumer-${{ matrix.tw }}
          path: tests/consumer/build/${{ matrix.tw }}.css
          if-no-files-found: error

  e2e:
    name: Playwright (Chromium)
    needs: consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tests/e2e/consumer-tailwind.spec.js serves what the consumer job compiled
      - uses: actions/download-artifact@v4
        with:
          pattern: consumer-*
          path: tests/consumer/build
          merge-multiple: true

      - run: node_modules/.bin/playwright install --with-deps chromium

      - run: node_modules/.bin/playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  dist:
    name: dist/ is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Committed dist/ matches the build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::dist/ is stale: run 'npm run build' and commit the result"
            exit 1
          fi
